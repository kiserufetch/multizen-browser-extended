name: CI

# Validation gate for every pull request and every push to master.
# Keeps the build green so release tags only ever fire on known-good commits.
on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          # setup-node enables package-manager caching by default, which runs
          # the global Yarn 1.x before Corepack is activated and chokes on the
          # project's "packageManager": "yarn@4.5.0". We cache Yarn ourselves.
          package-manager-cache: false

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Cache Yarn
        uses: actions/cache@v5
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Typecheck (all workspaces)
        run: yarn typecheck

      - name: Fingerprint unit scripts
        run: |
          yarn test:fingerprint
          yarn test:fingerprint-entropy
          yarn check:chrome-version

      - name: Launch timezone unit tests
        run: yarn test:launch-timezone

      # types / cdp-driver / mcp-server / profile-manager / browser-runtime / server node:test suites (input events, MCP
      # security gates, transport, process tree, CDP readiness, …).
      - name: Workspace unit tests
        run: yarn test:unit

      - name: Server build
        run: yarn workspace @multizen/server build

      - name: Fingerprint seed smoke (offline; live MCP optional)
        # Assert on the success marker, not the exit code: better-sqlite3's
        # native Database destructor aborts with SIGABRT (exit 134) during
        # Node 24 process teardown AFTER every check has passed and printed.
        # A real logic failure throws before the marker and exits 1, so the
        # grep still catches it.
        run: |
          out="$(yarn smoke:fingerprint-seed 2>&1)" || true
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qE "Offline (checks|\+ live checks) passed"

  # The server's image runs Node 22, so its tests run there too, and the image has to build.
  # The engine isn't in it: browsers only run in the live checks of apps/server/scripts/e2e.ts.
  server-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.5.0 --activate

      - name: Cache Yarn
        uses: actions/cache@v5
        with:
          path: |
            ~/.yarn/berry/cache
            .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable

      - name: Workspace unit tests
        run: yarn test:unit

      - name: Server build
        run: yarn workspace @multizen/server build

      - name: Compose file is valid
        run: docker compose config --quiet

      - name: Image build
        run: docker build -f docker/Dockerfile -t multizen-server:ci .

      - name: Detection baseline image build
        run: docker build -f docker/Dockerfile --target baseline -t multizen-baseline:ci .
